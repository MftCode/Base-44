services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # Platform sets this; Vite >= 6.1 appends it to allowedHosts. Passed through bare.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure

  api:
    image: node:22
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - api_node_modules:/app/backend/node_modules
      - api_data:/data
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node server.js"]
    expose:
      - "8000"
    environment:
      - PORT=8000
      - DATA_DIR=/data
      - BASE44_PREVIEW_MODE=1
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure

volumes:
  web_node_modules:
  api_node_modules:
  api_data:
